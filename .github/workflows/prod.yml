name: Prod · manual deploy main

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Production runs are serialized; a PR only tests and builds.
concurrency:
  group: prod-${{ github.event.pull_request.number || 'release' }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: aicase_ci
          POSTGRES_USER: aicase_ci
          POSTGRES_PASSWORD: ci-only-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U aicase_ci -d aicase_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: '1'
      DJANGO_SECRET_KEY: ci-only-not-a-deployment-secret
      POSTGRES_DB: aicase_ci
      POSTGRES_USER: aicase_ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-prod

  deploy:
    name: Test, build and deploy production
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: prod
      url: https://popomo.chunpat.cc
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: aicase_ci
          POSTGRES_USER: aicase_ci
          POSTGRES_PASSWORD: ci-only-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U aicase_ci -d aicase_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: '1'
      DJANGO_SECRET_KEY: ci-only-not-a-deployment-secret
      POSTGRES_DB: aicase_ci
      POSTGRES_USER: aicase_ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      DEPLOY_HOST: 2.25.179.110
      DEPLOY_USER: root
      DEPLOY_PORT: '22'
      RELEASE_ID: ${{ github.run_number }}-${{ github.run_attempt }}-${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # Keep the verified package on this runner; no artifact quota is needed.
      - uses: ./.github/actions/build-prod
      - name: Refuse an outdated main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/ref/heads/main",
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN']})
          with urllib.request.urlopen(req, timeout=30) as response:
              head = json.load(response)['object']['sha']
          if head != os.environ['GITHUB_SHA']:
              raise SystemExit('main has a newer commit. Deploy its workflow run instead.')
          PY
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/prod_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/prod_deploy ~/.ssh/known_hosts
      - name: Upload and deploy verified release
        run: |
          cd dist-release
          sha256sum --check SHA256SUMS
          target="$DEPLOY_USER@$DEPLOY_HOST"
          incoming="/tmp/aicase-prod-$RELEASE_ID"
          options=(-i "$HOME/.ssh/prod_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          ssh "${options[@]}" -p "$DEPLOY_PORT" "$target" "umask 077; mkdir '$incoming'"
          scp "${options[@]}" -P "$DEPLOY_PORT" release.tar.gz deploy.sh SHA256SUMS "$target:$incoming/"
          ssh "${options[@]}" -p "$DEPLOY_PORT" "$target" "cd '$incoming' && sha256sum --check SHA256SUMS && bash ./deploy.sh '$RELEASE_ID'"
      - name: Verify public HTTPS endpoints
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 30 https://popomo.chunpat.cc/api/health/
          curl --fail --silent --show-error --max-time 30 -o /dev/null https://popomo.chunpat.cc/admin/
          curl --fail --silent --show-error --max-time 30 -o /dev/null https://popomo.chunpat.cc/device.html
          echo 'Deployed to https://popomo.chunpat.cc' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove runner SSH files
        if: always()
        run: rm -f ~/.ssh/prod_deploy ~/.ssh/known_hosts
