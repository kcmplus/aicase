name: Dev · build and deploy

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

# A merge into dev is already a push; do not deploy twice for the same merge.
concurrency:
  group: dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: aicase_ci
          POSTGRES_USER: aicase_ci
          POSTGRES_PASSWORD: ci-only-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U aicase_ci -d aicase_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: '1'
      DJANGO_SECRET_KEY: ci-only-not-a-deployment-secret
      POSTGRES_DB: aicase_ci
      POSTGRES_USER: aicase_ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/admin/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          npm --prefix frontend/admin ci
      - name: Check deployment scripts
        run: |
          bash -n deploy/dev/deploy.sh
          bash -n deploy/dev/bootstrap.sh
          shellcheck deploy/dev/*.sh
          python -m unittest discover -s deploy/dev/tests -v
      - name: Test storefront and backend
        run: |
          npm test
          python backend/manage.py check
          python backend/manage.py makemigrations --check --dry-run
          python backend/manage.py test management_api
      - name: Build admin and release package
        run: |
          npm run build:admin
          python deploy/dev/package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aicase-dev-${{ github.sha }}
          path: dist-release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Deployment setup reminder
        if: github.ref == 'refs/heads/dev' && vars.DEV_DEPLOY_ENABLED != 'true'
        run: echo 'Build passed. Configure deployment secrets, then set repository variable DEV_DEPLOY_ENABLED=true.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy dev
    needs: build
    if: >-
      github.ref == 'refs/heads/dev' &&
      github.event_name != 'pull_request' &&
      vars.DEV_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: dev
      url: https://aicase.chunpat.cc
    env:
      DEPLOY_HOST: 177.3.42.128
      DEPLOY_USER: root
      DEPLOY_PORT: '22'
      RELEASE_ID: ${{ github.run_number }}-${{ github.run_attempt }}-${{ github.sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aicase-dev-${{ github.sha }}
          path: release
      - name: Refuse an outdated dev commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/ref/heads/dev",
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN']})
          with urllib.request.urlopen(req, timeout=30) as response:
              head = json.load(response)['object']['sha']
          if head != os.environ['GITHUB_SHA']:
              raise SystemExit('dev has a newer commit. Deploy its workflow run instead.')
          PY
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/dev_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/dev_deploy ~/.ssh/known_hosts
      - name: Upload and deploy verified release
        run: |
          cd release
          sha256sum --check SHA256SUMS
          target="$DEPLOY_USER@$DEPLOY_HOST"
          incoming="/tmp/aicase-dev-$RELEASE_ID"
          options=(-i "$HOME/.ssh/dev_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          ssh "${options[@]}" -p "$DEPLOY_PORT" "$target" "umask 077; mkdir '$incoming'"
          scp "${options[@]}" -P "$DEPLOY_PORT" release.tar.gz deploy.sh SHA256SUMS "$target:$incoming/"
          ssh "${options[@]}" -p "$DEPLOY_PORT" "$target" "cd '$incoming' && sha256sum --check SHA256SUMS && bash ./deploy.sh '$RELEASE_ID'"
      - name: Verify public HTTPS endpoints
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 30 https://aicase.chunpat.cc/api/health/
          curl --fail --silent --show-error --max-time 30 -o /dev/null https://aicase.chunpat.cc/admin/
          curl --fail --silent --show-error --max-time 30 -o /dev/null https://aicase.chunpat.cc/device.html
          echo 'Deployed to https://aicase.chunpat.cc' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove runner SSH files
        if: always()
        run: rm -f ~/.ssh/dev_deploy ~/.ssh/known_hosts
