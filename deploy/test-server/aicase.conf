server {
    listen 80;
    server_name aicase.dinglh.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/aicase.dinglh.cn;
        try_files $uri =404;
    }
    location / { return 301 https://aicase.dinglh.cn$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name aicase.dinglh.cn;
    root /www/wwwroot/aicase.dinglh.cn/current;
    index index.html;
    ssl_certificate /www/server/panel/vhost/letsencrypt/aicase.dinglh.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/letsencrypt/aicase.dinglh.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AICASE:1m;
    ssl_session_timeout 10m;
    location ~ /\. { return 404; }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
    }
    access_log /www/wwwlogs/aicase.dinglh.cn.log;
    error_log /www/wwwlogs/aicase.dinglh.cn.error.log;
}
