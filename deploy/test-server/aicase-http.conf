server {
    listen 80;
    server_name aicase.dinglh.cn;
    root /www/wwwroot/aicase.dinglh.cn/current;
    index index.html;
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/aicase.dinglh.cn;
        try_files $uri =404;
    }
    location ~ /\. { return 404; }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
    access_log /www/wwwlogs/aicase.dinglh.cn.log;
    error_log /www/wwwlogs/aicase.dinglh.cn.error.log;
}
