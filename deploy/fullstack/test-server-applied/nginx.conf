limit_req_zone $binary_remote_addr zone=aicase_login:10m rate=10r/m;
server {
    listen 80;
    server_name aicase.dinglh.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/aicase.dinglh.cn;
        try_files $uri =404;
    }
    location / { return 301 https://aicase.dinglh.cn$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name aicase.dinglh.cn;
    root /www/wwwroot/aicase.dinglh.cn/current;
    index index.html;
    ssl_certificate /www/server/panel/vhost/letsencrypt/aicase.dinglh.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/letsencrypt/aicase.dinglh.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AICASE:1m;
    ssl_session_timeout 10m;
    client_max_body_size 12m;
    location = /admin { return 301 /admin/; }
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /admin/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location = /api/v1/auth/login/ {
        limit_req zone=aicase_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        add_header Cache-Control "no-store" always;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:18010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /assets/optimized/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /media/previews/ {
        alias /var/lib/aicase/media/previews/;
        autoindex off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location /media/ {
        alias /var/lib/aicase/media/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ /\. { return 404; }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
    }
    access_log /www/wwwlogs/aicase.dinglh.cn.log;
    error_log /www/wwwlogs/aicase.dinglh.cn.error.log;
}
