# Include inside the HTTPS server block for popomo.chunpat.cc.
root /opt/aicase-prod/current/frontend/storefront;
index index.html;
client_max_body_size 12m;

if (-f /var/lib/aicase-prod/deploying) { return 503; }

location = /admin { return 301 /admin/; }
location /admin/ {
    try_files $uri $uri/ /admin/index.html;
    add_header Cache-Control "no-cache";
}
location /api/ {
    proxy_pass http://127.0.0.1:18012;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 90s;
}
location /media/ {
    alias /var/lib/aicase-prod/media/;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
}
location /static/ {
    alias /opt/aicase-prod/current/backend/staticfiles/;
    autoindex off;
}
location ~ /\. { deny all; }
location ~* \.(js|css|html)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
}
location / { try_files $uri $uri/ /index.html; }
