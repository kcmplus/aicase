# BaoTa-managed production site; certificate must cover all three names.
# Destination: /www/server/panel/vhost/nginx/popomoshop.com.conf
# Keep the first root as the serving root: BaoTa SiteStop/SiteStart rewrites it and toggles includes.
server {
    listen 443 ssl;
    server_name popomoshop.com www.popomoshop.com popomo.chunpat.cc;
    root /opt/aicase-prod/current/frontend/storefront;
    ssl_certificate /etc/letsencrypt/live/popomoshop.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/popomoshop.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /www/wwwlogs/aicase-popomoshop.log;
    error_log /www/wwwlogs/aicase-popomoshop.error.log;
    include /etc/aicase-prod/nginx.canonical.conf;
    include /etc/aicase-prod/nginx.locations.conf;
}
server {
    listen 80;
    server_name popomoshop.com www.popomoshop.com popomo.chunpat.cc;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/aicase-prod/acme; }
    location / { return 301 https://$host$request_uri; }
}
